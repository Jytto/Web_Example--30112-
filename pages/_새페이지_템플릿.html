<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>공부 플래너</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="/static/css/study-planner.css">
</head>

<body data-require-auth="true">
  <header id="nav"></header>

  <main class="study-page">
    <section class="study-intro" aria-labelledby="pageTitle">
      <p id="todayDate" class="study-date"></p>
      <h1 id="pageTitle">오늘의 공부를 시작해 볼까요?</h1>
    </section>

    <section class="study-stats" aria-label="오늘의 공부 요약">
      <article class="study-stat">
        <span class="study-stat-icon" aria-hidden="true">◷</span>
        <div><p class="study-stat-label">오늘 공부</p><p id="todayMinutes" class="study-stat-value">0분</p></div>
      </article>
      <article class="study-stat">
        <span class="study-stat-icon" aria-hidden="true">◎</span>
        <div><p class="study-stat-label">오늘 할 일</p><p id="todayTasks" class="study-stat-value">0/0</p></div>
      </article>
      <article class="study-stat">
        <span class="study-stat-icon" aria-hidden="true">★</span>
        <div><p class="study-stat-label">전체 완료</p><p id="totalDone" class="study-stat-value">0개</p></div>
      </article>
      <article class="study-stat">
        <span class="study-stat-icon" aria-hidden="true">↗</span>
        <div><p class="study-stat-label">오늘 달성률</p><p id="todayCompletion" class="study-stat-value">0%</p></div>
      </article>
    </section>

    <section class="study-columns" aria-label="타이머와 주간 공부 기록">
      <article class="study-panel study-timer-panel">
        <div id="timerModes" class="study-mode-tabs" role="group" aria-label="타이머 모드">
          <button type="button" class="is-active" data-mode="focus" aria-pressed="true">집중</button>
          <button type="button" data-mode="short" aria-pressed="false">짧은 휴식</button>
          <button type="button" data-mode="long" aria-pressed="false">긴 휴식</button>
        </div>

        <div class="study-clock">
          <svg viewBox="0 0 256 256" aria-hidden="true">
            <circle class="study-clock-track" cx="128" cy="128" r="112"></circle>
            <circle id="timerRingProgress" class="study-clock-progress" cx="128" cy="128" r="112" stroke-dasharray="703.72" stroke-dashoffset="703.72"></circle>
          </svg>
          <div class="study-clock-copy" aria-live="polite">
            <p id="timerModeLabel" class="study-clock-mode">집중 시간</p>
            <p id="timerDisplay" class="study-clock-time">25:00</p>
            <p id="timerStatus" class="study-clock-status">준비되면 시작하세요</p>
          </div>
        </div>

        <div class="study-timer-controls">
          <select id="timerSubject" aria-label="공부 과목">
            <option>국어</option><option selected>수학</option><option>영어</option>
            <option>과학</option><option>사회</option><option>기타</option>
          </select>
          <button id="timerToggle" class="study-timer-start" type="button" aria-label="타이머 시작">시작</button>
          <button id="timerReset" class="study-timer-reset" type="button" aria-label="타이머 초기화" title="초기화">↺</button>
        </div>
      </article>

      <article class="study-panel study-week-panel">
        <div class="study-panel-heading">
          <div>
            <p class="study-eyebrow">WEEKLY REPORT</p>
            <h2>주간 공부 기록</h2>
          </div>
          <div class="study-week-nav" aria-label="주간 기록 탐색">
            <button id="weekPrevious" type="button" aria-label="이전 주">‹</button>
            <button id="weekCurrent" class="study-week-current" type="button">이번 주</button>
            <button id="weekNext" type="button" aria-label="다음 주">›</button>
          </div>
        </div>
        <div id="weekChart" class="study-week-chart" role="img" aria-label="요일별 공부 시간 막대 그래프"></div>
        <div class="study-week-total"><span>이번 주 총 공부 시간</span><strong id="weekTotal">0분</strong></div>
      </article>
    </section>

    <section class="study-panel study-task-panel" aria-labelledby="taskHeading">
      <div class="study-panel-heading study-task-heading">
        <div class="study-panel-heading-title">
          <p class="study-eyebrow">TASK PLANNER</p>
          <h2 id="taskHeading">공부 할 일</h2>
        </div>
        <button id="openTaskForm" class="study-add-button" type="button"><span aria-hidden="true">+</span> 할 일 추가</button>
      </div>
      <div id="taskFilters" class="study-filters" aria-label="할 일 필터"></div>
      <ul id="taskList" class="study-task-list" aria-live="polite"></ul>
      <div id="taskEmpty" class="study-empty" hidden>
        <span class="study-empty-mark" aria-hidden="true">◎</span>
        <p>등록된 할 일이 없어요</p>
        <button id="emptyAddTask" type="button">첫 할 일 추가하기</button>
      </div>
    </section>
  </main>

  <dialog id="taskDialog" class="study-dialog" aria-labelledby="taskDialogTitle">
    <form id="taskForm" class="study-dialog-form">
      <div class="study-dialog-heading">
        <div><p class="study-eyebrow">NEW TASK</p><h2 id="taskDialogTitle">새 할 일 추가</h2></div>
        <button id="closeTaskForm" class="study-dialog-close" type="button" aria-label="닫기">×</button>
      </div>
      <label for="taskTitle">할 일</label>
      <input id="taskTitle" name="title" type="text" maxlength="160" placeholder="예: 수학 문제집 20쪽 풀기" required>
      <div class="study-form-grid">
        <div class="study-field">
          <label for="taskSubject">과목</label>
          <select id="taskSubject" name="subject">
            <option>국어</option><option selected>수학</option><option>영어</option>
            <option>과학</option><option>사회</option><option>기타</option>
          </select>
        </div>
        <div class="study-field">
          <label for="taskPriority">중요도</label>
          <select id="taskPriority" name="priority"><option>낮음</option><option selected>보통</option><option>높음</option></select>
        </div>
      </div>
      <label for="taskDue">마감일</label>
      <input id="taskDue" name="due" type="date" required>
      <button class="study-save-button" type="submit">할 일 저장</button>
    </form>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/static/js/common.js"></script>
  <script src="/static/js/study-planner.js"></script>
</body>
</html>
